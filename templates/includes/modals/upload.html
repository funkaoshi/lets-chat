<% if settings.files.enable %>
<div id="lcb-upload" class="modal dropzone fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <form class="validate" action="./files" method="post">
                <div class="modal-header">
                    <h4 class="modal-title"><i class="fa fa-upload"></i> <$ __('Upload') $></h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="<$ __('Close') $>"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group row">
                        <div class="col-sm-14 offset-sm-2">
                            <button class="lcb-upload-target btn btn-primary btn-lg w-100"><$ __('Select Files') $></button>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-form-label col-sm-6"><$ __('Room') $></label>
                        <div class="col-sm-10">
                            <select class="form-select form-select-lg" name="room"></select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-form-label col-sm-6"><$ __('Post in room?') $></label>
                        <div class="col-sm-11">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" checked name="post" id="lcb-upload-post-check" />
                                <label class="form-check-label" for="lcb-upload-post-check"></label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-sm-18">
                            <div class="lcb-upload-preview-files"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <$ __('Cancel') $>
                    </button>
                    <button type="submit" class="btn btn-info indicator" name="submit">
                        <i class="icon-ok"></i> <$ __('Upload') $>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<% endif %>
