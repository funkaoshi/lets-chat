# Let's Chat: Docker Compose
# Run from repo root:  docker compose -f docker/docker-compose.yml up
# Or from docker/:     docker compose up

name: lets-chat

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      LCB_DATABASE_URI: mongodb://mongo/letschat
    volumes:
      - app-uploads:/usr/src/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
  app-uploads:
